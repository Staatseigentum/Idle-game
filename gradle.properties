# Single source of truth for the app version. Consumed by the Android versionName, the desktop
# package version, the generated BuildInfo constant and the update checker, so a release only
# ever needs this one line changed (plus a matching v-prefixed git tag).
embercrown.version=0.5.3
embercrown.versionCode=15

# GitHub repository the in-app update check and the launcher poll for new releases.
embercrown.repo=Staatseigentum/Idle-game

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
