name: Release

# Publishing is driven entirely by the tag: push v1.2.3 and this builds every artifact and
# attaches it to the matching GitHub release. The launcher and the in-app update check both
# read that release, so a release without these assets is a release nobody can install.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach artifacts to (e.g. v0.0.1)'
        required: true

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.os_token }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os_token: windows
          - runner: ubuntu-latest
            os_token: linux
          - runner: macos-latest
            os_token: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify gameplay and updater on this platform
        run: ./gradlew :composeApp:desktopTest :launcher:test --no-daemon
        shell: bash

      # rpmbuild isn't preinstalled on the ubuntu runner; jpackage shells out to it for packageRpm.
      - name: Install rpm packaging tools
        if: matrix.os_token == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # A Compose Desktop uber jar bundles the Skiko native library for the OS it is built on,
      # so each platform needs its own build; a single shared jar would fail to start elsewhere.
      # It still ships alongside the installer below: the launcher/in-app updater fetch this jar
      # directly rather than re-running a platform installer for every update.
      - name: Build uber jar
        run: ./gradlew :composeApp:packageUberJarForCurrentOS --no-daemon
        shell: bash

      # Native installer(s) for a fresh install: MSI on Windows, DMG on macOS, DEB+RPM on Linux.
      # These package :launcher, not :composeApp — the installed app is the auto-updating
      # bootstrap, which downloads and runs the uber jar built above (see launcher/build.gradle.kts).
      - name: Build native installer
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os_token }}" in
            windows) ./gradlew :launcher:packageMsi --no-daemon ;;
            macos)   ./gradlew :launcher:packageDmg --no-daemon ;;
            linux)   ./gradlew :launcher:packageDeb :launcher:packageRpm --no-daemon ;;
          esac

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          jar=$(find composeApp/build/compose/jars -name '*.jar' | head -n1)
          if [ -z "$jar" ]; then echo "no uber jar produced"; exit 1; fi
          mkdir -p dist
          cp "$jar" "dist/Embercrown-${{ matrix.os_token }}.jar"

          installers=$(find launcher/build/compose/binaries/main -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \))
          if [ -z "$installers" ]; then echo "no installer produced"; exit 1; fi
          while IFS= read -r f; do
            ext="${f##*.}"
            cp "$f" "dist/Embercrown-${{ matrix.os_token }}.$ext"
          done <<< "$installers"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os_token }}
          path: dist/*

  android-and-launcher:
    name: Android APK + launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Debug-signed: installable straight away, unlike an unsigned release APK. Swap in a real
      # keystore here before shipping anything to the Play Store.
      - name: Build Android APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon

      - name: Build launcher
        run: ./gradlew :launcher:jar --no-daemon

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          apk=$(find composeApp/build/outputs/apk -name '*.apk' | head -n1)
          if [ -z "$apk" ]; then echo "no apk produced"; exit 1; fi
          cp "$apk" dist/Embercrown-android.apk
          cp launcher/build/libs/launcher.jar dist/Embercrown-Launcher.jar
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-and-launcher
          path: dist/*

  publish:
    name: Attach to release
    needs: [desktop, android-and-launcher]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staged

      - name: Flatten artifact directories
        run: |
          set -euo pipefail
          mkdir -p dist
          find staged -type f \( -name '*.jar' -o -name '*.apk' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} dist/ \;
          ls -la dist

      - name: Prepare player-facing release notes
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          awk -v version="$version" '
            /^## / {
              if (found) exit
              if (index($0, "## " version " ") == 1) found = 1
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true

  itch:
    name: Publish to itch.io
    needs: [desktop, android-and-launcher]
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: staatseigentum/embercrown
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staged

      # butler push replaces whatever it previously pushed to a given channel, so this alone
      # keeps each platform page down to the current build — no separate delete step needed.
      - name: Install butler
        run: |
          set -euo pipefail
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          # GITHUB_PATH only takes effect starting with the *next* step, so verify via the
          # full path here rather than a bare `butler` call.
          echo "$PWD/butler" >> "$GITHUB_PATH"
          ./butler/butler -V

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Push Windows build (.msi)
        run: butler push staged/desktop-windows/Embercrown-windows.msi "$ITCH_TARGET:windows" --userversion "${{ steps.version.outputs.version }}"

      - name: Push macOS build (.dmg)
        run: butler push staged/desktop-macos/Embercrown-macos.dmg "$ITCH_TARGET:mac" --userversion "${{ steps.version.outputs.version }}"

      - name: Push Linux build (.deb + .rpm)
        run: |
          set -euo pipefail
          mkdir -p linux-dist
          cp staged/desktop-linux/Embercrown-linux.deb staged/desktop-linux/Embercrown-linux.rpm linux-dist/
          butler push linux-dist "$ITCH_TARGET:linux" --userversion "${{ steps.version.outputs.version }}"

      - name: Push Android build (.apk)
        run: butler push staged/android-and-launcher/Embercrown-android.apk "$ITCH_TARGET:android" --userversion "${{ steps.version.outputs.version }}"

      - name: Push changelog
        run: butler push CHANGELOG.md "$ITCH_TARGET:changelog" --userversion "${{ steps.version.outputs.version }}"
